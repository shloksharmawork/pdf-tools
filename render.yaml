services:
  # Backend Service
  - type: web
    name: pdf-tools-backend
    runtime: docker
    region: singapore
    plan: free
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: MAX_FILE_SIZE_MB
        value: 25
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: RATE_LIMIT_PER_MIN
        value: 30
      - key: CORS_ORIGINS
        value: "*"
    healthCheckPath: /health

  # Frontend Service
  - type: web
    name: pdf-tools-frontend
    runtime: docker
    region: singapore
    plan: free
    dockerContext: .
    dockerfilePath: ./frontend/Dockerfile
    envVars:
      - key: NEXT_PUBLIC_BACKEND_URL
        fromService:
          type: web
          name: pdf-tools-backend
          property: host
      - key: PORT
        value: 3000
